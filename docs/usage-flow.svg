<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- background -->
  <rect width="1100" height="260" fill="#0f172a" rx="16"/>

  <!-- Step 1 -->
  <rect x="40" y="70" width="220" height="120" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#60a5fa">1 · Screenshot</text>
  <text x="150" y="145" text-anchor="middle" font-size="14" fill="#94a3b8">capture the error / UI</text>
  <text x="150" y="168" text-anchor="middle" font-size="13" fill="#64748b">Win+Shift+S · Cmd+Shift+4</text>

  <!-- arrow -->
  <line x1="260" y1="130" x2="310" y2="130" stroke="#64748b" stroke-width="3"/>
  <polygon points="310,124 326,130 310,136" fill="#64748b"/>

  <!-- Step 2 -->
  <rect x="330" y="70" width="220" height="120" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="440" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#60a5fa">2 · Copy</text>
  <text x="440" y="145" text-anchor="middle" font-size="14" fill="#94a3b8">it's on the clipboard</text>
  <text x="440" y="168" text-anchor="middle" font-size="13" fill="#64748b">auto-copied or Ctrl+C</text>

  <!-- arrow -->
  <line x1="550" y1="130" x2="600" y2="130" stroke="#64748b" stroke-width="3"/>
  <polygon points="600,124 616,130 600,136" fill="#64748b"/>

  <!-- Step 3 -->
  <rect x="620" y="70" width="220" height="120" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="730" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#34d399">3 · Ask</text>
  <text x="730" y="145" text-anchor="middle" font-size="16" fill="#a7f3d0">"看看这个"</text>
  <text x="730" y="168" text-anchor="middle" font-size="13" fill="#64748b">or "analyze this"</text>

  <!-- arrow -->
  <line x1="840" y1="130" x2="890" y2="130" stroke="#64748b" stroke-width="3"/>
  <polygon points="890,124 906,130 890,136" fill="#64748b"/>

  <!-- Step 4 -->
  <rect x="910" y="70" width="150" height="120" rx="14" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="2"/>
  <text x="985" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#34d399">4 · Done</text>
  <text x="985" y="145" text-anchor="middle" font-size="13" fill="#94a3b8">agent analyzes</text>
  <text x="985" y="165" text-anchor="middle" font-size="13" fill="#94a3b8">automatically</text>

  <!-- footer note -->
  <text x="550" y="225" text-anchor="middle" font-size="14" fill="#64748b">Claude Code's auto-loop hook snapshots the clipboard for you — other agents: give a file path or say "看剪贴板".</text>
</svg>

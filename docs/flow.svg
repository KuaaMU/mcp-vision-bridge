<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- background -->
  <rect width="1100" height="300" fill="#0f172a" rx="16"/>

  <!-- Step 1: Agent -->
  <rect x="40" y="90" width="200" height="120" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="140" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#60a5fa">Your Agent</text>
  <text x="140" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">text-only model</text>
  <text x="140" y="190" text-anchor="middle" font-size="13" fill="#64748b">DeepSeek · Qwen · Kimi</text>

  <!-- arrow 1 -->
  <line x1="240" y1="150" x2="310" y2="150" stroke="#64748b" stroke-width="3"/>
  <polygon points="310,144 326,150 310,156" fill="#64748b"/>
  <text x="276" y="135" text-anchor="middle" font-size="12" fill="#64748b">calls</text>
  <text x="283" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#a5f3fc">analyze_image</text>

  <!-- Step 2: MCP bridge -->
  <rect x="330" y="90" width="200" height="120" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#34d399">mcp-vision-bridge</text>
  <text x="430" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">resolves the image</text>
  <text x="430" y="190" text-anchor="middle" font-size="13" fill="#64748b">path · URL · clipboard</text>

  <!-- arrow 2 -->
  <line x1="530" y1="150" x2="600" y2="150" stroke="#64748b" stroke-width="3"/>
  <polygon points="600,144 616,150 600,156" fill="#64748b"/>
  <text x="570" y="135" text-anchor="middle" font-size="12" fill="#64748b">sends pixels</text>

  <!-- Step 3: Vision model -->
  <rect x="620" y="90" width="200" height="120" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="720" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#a78bfa">Vision Model</text>
  <text x="720" y="170" text-anchor="middle" font-size="14" fill="#94a3b8">multimodal</text>
  <text x="720" y="190" text-anchor="middle" font-size="13" fill="#64748b">mimo · Claude · Gemini</text>

  <!-- return arrow -->
  <path d="M 720 210 L 720 250 L 140 250 L 140 210" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="134,214 140,228 146,214" fill="#f59e0b"/>
  <text x="430" y="240" text-anchor="middle" font-size="13" fill="#f59e0b">returns detailed text description</text>

  <!-- result label -->
  <rect x="850" y="90" width="210" height="120" rx="14" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="955" y="135" text-anchor="middle" font-size="16" font-weight="600" fill="#fbbf24">Agent reasons</text>
  <text x="955" y="160" text-anchor="middle" font-size="13" fill="#94a3b8">fixes the bug,</text>
  <text x="955" y="180" text-anchor="middle" font-size="13" fill="#94a3b8">explains the UI</text>
  <text x="955" y="200" text-anchor="middle" font-size="13" fill="#64748b">no images in context</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- background -->
  <rect width="1200" height="560" fill="#f8fafc"/>

  <!-- left card: input image -->
  <rect x="30" y="30" width="500" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="62" font-size="18" font-weight="700" fill="#0f172a">INPUT</text>
  <text x="60" y="86" font-size="13" fill="#64748b">brian-griffin.webp</text>
  <image href="data:image/webp;base64,BRIAN_IMG" x="48" y="104" width="464" height="274" preserveAspectRatio="xMidYMid meet"/>
  <text x="60" y="430" font-size="13" fill="#64748b">Call:</text>
  <text x="60" y="452" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">analyze_image(image=..., task="describe")</text>

  <!-- right card: output text -->
  <rect x="560" y="30" width="610" height="470" rx="14" fill="#0f172a"/>
  <text x="590" y="62" font-size="18" font-weight="700" fill="#a5f3fc">OUTPUT · mimo-v2.5</text>
  <text x="590" y="86" font-size="13" fill="#64748b">exhaustive description</text>

  <g transform="translate(590, 120)" font-family="'Segoe UI', system-ui, sans-serif" font-size="16">
    <text fill="#cdd6f4">Brian Griffin, the anthropomorphic dog from</text>
    <text y="28" fill="#cdd6f4">Family Guy, standing on two legs against a</text>
    <text y="56" fill="#cdd6f4">plain white background.</text>
    <text y="92" fill="#a6e3a1">· white fur, large black nose, brown eyes</text>
    <text y="120" fill="#a6e3a1">· red collar with yellow-orange tag</text>
    <text y="148" fill="#a6e3a1">· right paw raised, holding a champagne</text>
    <text y="176" fill="#a6e3a1">  flute with pale yellow bubbly liquid</text>
    <text y="212" fill="#f9e2af">Watermark (bottom-right): green speech-</text>
    <text y="240" fill="#f9e2af">bubble icon + Chinese text "某某软件"</text>
    <text y="280" fill="#64748b">/* full layout, colors, states, anomalies */</text>
  </g>

  <!-- arrow -->
  <text x="528" y="270" font-size="28" fill="#94a3b8">→</text>
</svg>

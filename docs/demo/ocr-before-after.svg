<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- background -->
  <rect width="1200" height="560" fill="#f8fafc"/>

  <!-- left card: input image -->
  <rect x="30" y="30" width="500" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="62" font-size="18" font-weight="700" fill="#0f172a">INPUT</text>
  <text x="60" y="86" font-size="13" fill="#64748b">terminal-error.png</text>
  <image href="data:image/png;base64,TERMINAL_IMG" x="48" y="104" width="464" height="274" preserveAspectRatio="xMidYMid meet"/>
  <text x="60" y="430" font-size="13" fill="#64748b">Call:</text>
  <text x="60" y="452" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155">analyze_image(image=..., task="ocr")</text>

  <!-- right card: output text -->
  <rect x="560" y="30" width="610" height="470" rx="14" fill="#0f172a"/>
  <text x="590" y="62" font-size="18" font-weight="700" fill="#a5f3fc">OUTPUT · mimo-v2.5</text>
  <text x="590" y="86" font-size="13" fill="#64748b">verbatim text extraction</text>

  <g transform="translate(590, 120)" font-family="Consolas, Menlo, monospace" font-size="17">
    <text fill="#f9e2af">$ npm run build</text>
    <text y="34" fill="#f38ba8">error TS2345:</text>
    <text y="64" fill="#cdd6f4">  Argument of type 'string' is not</text>
    <text y="90" fill="#cdd6f4">  assignable to parameter of type 'number'.</text>
    <text y="122" fill="#a6e3a1">  src/utils/parse.ts:42:18</text>
    <text y="148" fill="#cdd6f4">  42 | const id = parseInt(line, radix);</text>
    <text y="174" fill="#89b4fa">     |            ~~~~~~</text>
    <text y="210" fill="#64748b">/* every line on screen, in order */</text>
  </g>

  <!-- arrow -->
  <text x="528" y="270" font-size="28" fill="#94a3b8">→</text>
</svg>
